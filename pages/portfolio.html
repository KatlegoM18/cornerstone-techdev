<!DOCTYPE html>
<html lang="en">

<head>

        type="image/png"

    >

        content="Explore selected web design and full-stack development work by CornerStone TechDev."
    >

    <!-- MAIN SITE CSS -->
    <link
        rel="stylesheet"
        href="../css/index.css"
    >

    <!-- PORTFOLIO CSS -->
    <link
        rel="stylesheet"
        href="../css/portfolio.css"
    >

    <!-- MOLTEN METAL BACKGROUND -->
    <script
        type="module"
        src="../js/molten-metal.js"
    ></script>

    <!-- 3D CT LOGO -->
    <script
        type="module"
        src="../js/ct-logo-3d.js"
    ></script>

</head>


<body>

    <!-- ==========================================
         MOLTEN METAL BACKGROUND
    =========================================== -->

    <div class="molten-background">
        <canvas id="molten-canvas"></canvas>
    </div>


    <!-- ==========================================
         NAVIGATION
    =========================================== -->

    <header class="navbar">

        <div class="logo">

            <a href="../index.html">

                    <canvas id="ct-logo-canvas"></canvas>
                </div>

                <span>
                    CornerStone
                    <strong>TechDev</strong>
                </span>

            </a>

        </div>


        <button
            class="menu-toggle"
            id="menu-toggle"
            type="button"
            aria-label="Open navigation menu"
            aria-expanded="false"
            aria-controls="nav-links"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>


        <nav
            class="nav-links"
            id="nav-links"
            aria-label="Main navigation"
        >

            <a href="../index.html">
                Home
            </a>

            <a href="services.html">
                Services
            </a>

            <a
                href="portfolio.html"
                class="active"
                aria-current="page"
            >
                Portfolio
            </a>


            <a href="projects.html">
                Projects
            </a>

            <a href="about.html">
                About
            </a>

            <a
                href="contact.html"
                class="nav-contact"
            >
                Contact
            </a>

        </nav>

    </header>


    <!-- ==========================================
         MAIN
    =========================================== -->

    <main>


        <!-- ======================================

        ======================================= -->

        <section class="portfolio-coming-soon">

            <div class="portfolio-coming-soon-content">

                <p class="portfolio-eyebrow">
                    PORTFOLIO
                </p>

                <h1>
                    SOMETHING
                    <span>
                        IS COMING.
                    </span>
                </h1>

                <p>
                    We're putting together a collection of
                    creative websites, experiments, and digital
                    experiences. The first one is already being built.
                </p>

                <div class="portfolio-coming-soon-banner">
                    <span>
                        COMING SOON
                    </span>
                </div>

            </div>

        </section>


    </main>


    <!-- ==========================================
         FOOTER
    =========================================== -->

    <footer>

        <p>
            © 2026 CornerStone TechDev.
            All rights reserved.
        </p>

    </footer>


    <!-- ==========================================
         PORTFOLIO CAROUSEL
    =========================================== -->

    <script
        src="../js/portfolio-carousel.js"
    ></script>


    <!-- ==========================================
         MOBILE NAVIGATION
    =========================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                const menuToggle =
                    document.getElementById(
                        "menu-toggle"
                    );

                const navLinks =
                    document.getElementById(
                        "nav-links"
                    );


                if (
                    !menuToggle ||
                    !navLinks
                ) {
                    return;
                }


                function closeMenu() {

                    navLinks.classList.remove(
                        "active"
                    );

                    menuToggle.classList.remove(
                        "active"
                    );

                    menuToggle.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                    menuToggle.setAttribute(
                        "aria-label",
                        "Open navigation menu"
                    );

                    document.body.classList.remove(
                        "menu-open"
                    );

                }


                menuToggle.addEventListener(
                    "click",
                    () => {

                        const isOpen =
                            navLinks.classList.toggle(
                                "active"
                            );


                        menuToggle.classList.toggle(
                            "active",
                            isOpen
                        );


                        menuToggle.setAttribute(
                            "aria-expanded",
                            String(isOpen)
                        );


                        menuToggle.setAttribute(
                            "aria-label",
                            isOpen
                                ? "Close navigation menu"
                                : "Open navigation menu"
                        );


                        document.body.classList.toggle(
                            "menu-open",
                            isOpen
                        );

                    }
                );


                navLinks
                    .querySelectorAll("a")
                    .forEach(
                        (link) => {

                            link.addEventListener(
                                "click",
                                closeMenu
                            );

                        }
                    );


                document.addEventListener(
                    "keydown",
                    (event) => {

                        if (
                            event.key === "Escape"
                        ) {

                            closeMenu();

                        }

                    }
                );

            }
        );

    </script>

</body>

</html>
